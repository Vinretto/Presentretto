<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación Fullscreen</title>
  <style>* { box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; margin: 0; padding: 0; background: #2b2b2b !important; overflow: hidden; font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .deck { width: 100%; height: 100%; position: relative; }
    .slide { position: absolute; inset: 0; display: none; }
    .slide.active { display: block; }
    .slide-inner {
      position: absolute;
      top: 50%; left: 50%;
      width: 1000px; height: 562.5px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 8px 40px rgba(0,0,0,.55);
    }</style>
</head>
<body>
  <div class="deck" id="deck">
  <section class="slide active" data-index="0">
    <div class="slide-inner" style="background:#0d0c0c;">
      <div class="slide-el" style="position:absolute; left:10.9%; top:7.6%; width:39.1%; height:87.5%; z-index:1; opacity:1;overflow:hidden;"><img src="https://yt3.ggpht.com/l3cs5mLADhNSFieZ35stEwjfEzTRWTZZEWH8deIFJEjSu0FqG1YDgL8B47RDi28OYb-Qe9q9YvM4Mg=s512-rw-nd-v1" style="width:100%;height:100%;object-fit:fill;display:block;"></div>
      <div class="slide-el" style="position:absolute; left:57.6%; top:17%; width:20%; height:50%; z-index:2; opacity:1;overflow:hidden;"><img src="https://yt3.ggpht.com/l3cs5mLADhNSFieZ35stEwjfEzTRWTZZEWH8deIFJEjSu0FqG1YDgL8B47RDi28OYb-Qe9q9YvM4Mg=s512-rw-nd-v1" style="width:100%;height:100%;object-fit:fill;display:block;"></div>
    </div>
  </section>
  </div>
  <script>const slides = document.querySelectorAll('.slide'); let current = 0; function show(i) { slides.forEach((s, idx) => s.classList.toggle('active', idx === i)); } document.addEventListener('keydown', (e) => { if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { current = Math.min(slides.length-1, current+1); show(current); } if(e.key === 'ArrowLeft') { current = Math.max(0, current-1); show(current); } }); document.addEventListener('click', () => { current = Math.min(slides.length-1, current+1); show(current); }); function fitScreen() { const w = window.innerWidth; const h = window.innerHeight; const scale = Math.min(w / 1000, h / 562.5); document.querySelectorAll('.slide-inner').forEach(inner => { inner.style.transform = 'translate(-50%, -50%) scale(' + scale + ')'; }); } window.addEventListener('resize', fitScreen); fitScreen();</script>
</body>
</html>
